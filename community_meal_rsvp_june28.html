<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
.page { max-width: 640px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
.header { text-align: center; margin-bottom: 2rem; padding-bottom: 1.5rem; border-bottom: 0.5px solid var(--color-border-tertiary); }
.logo { max-width: 260px; height: auto; margin-bottom: 0.75rem; }
h1 { font-size: 20px; font-weight: 500; color: var(--color-text-primary); margin-bottom: 0.25rem; }
.subtitle { font-size: 14px; color: var(--color-text-secondary); }
.items-section { background: var(--color-background-secondary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg, 12px); padding: 1rem 1.25rem; margin-bottom: 1.5rem; }
.items-title { font-size: 12px; font-weight: 500; color: var(--color-text-secondary); margin-bottom: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; }
.item-row { display: flex; align-items: center; padding: 0.5rem 0; border-bottom: 0.5px solid var(--color-border-tertiary); gap: 12px; }
.item-row:last-child { border-bottom: none; }
.item-info { flex: 1; }
.item-name { font-size: 14px; font-weight: 500; color: var(--color-text-primary); }
.item-status { font-size: 12px; margin-top: 2px; }
.item-status.needed { color: var(--color-text-secondary); }
.item-status.done { color: var(--color-text-success); }
.progress-bar { height: 4px; border-radius: 2px; background: var(--color-border-tertiary); margin-top: 5px; width: 100%; }
.progress-fill { height: 100%; border-radius: 2px; background: var(--color-border-success); transition: width 0.3s; }
.form-card { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg, 12px); padding: 1.25rem; }
.field { margin-bottom: 1.1rem; }
.field-label { display: block; font-size: 14px; font-weight: 500; color: var(--color-text-secondary); margin-bottom: 0.4rem; }
input[type=text], input[type=email], input[type=number], textarea { width: 100%; }
.radio-group { display: flex; flex-direction: column; gap: 8px; margin-top: 0.4rem; }
.radio-group label { font-size: 14px; font-weight: 400; color: var(--color-text-primary); display: flex; align-items: center; gap: 8px; cursor: pointer; }
.hidden { display: none !important; }
.items-grid { display: flex; flex-direction: column; gap: 10px; margin-top: 0.4rem; }
.item-picker { display: flex; align-items: center; justify-content: space-between; padding: 0.6rem 0.75rem; border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md, 8px); background: var(--color-background-secondary); gap: 12px; }
.item-picker.fully-claimed { opacity: 0.45; pointer-events: none; }
.item-picker-name { font-size: 14px; color: var(--color-text-primary); flex: 1; }
.item-picker-remaining { font-size: 12px; color: var(--color-text-secondary); white-space: nowrap; }
.qty-control { display: flex; align-items: center; gap: 8px; }
.qty-btn { width: 28px; height: 28px; border-radius: 50%; border: 0.5px solid var(--color-border-secondary); background: var(--color-background-primary); font-size: 18px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--color-text-primary); }
.qty-btn:disabled { opacity: 0.3; cursor: default; }
.qty-val { font-size: 15px; font-weight: 500; min-width: 20px; text-align: center; color: var(--color-text-primary); }
.info-note { background: var(--color-background-info); border: 0.5px solid var(--color-border-info); border-radius: var(--border-radius-md, 8px); padding: 0.75rem 1rem; font-size: 13px; color: var(--color-text-info); margin-top: 0.6rem; }
.submit-btn { width: 100%; padding: 0.75rem; margin-top: 0.75rem; font-size: 15px; font-weight: 500; cursor: pointer; }
.success-card { background: var(--color-background-success); border: 0.5px solid var(--color-border-success); border-radius: var(--border-radius-lg, 12px); padding: 1.5rem; text-align: center; color: var(--color-text-success); display: none; }
.success-card strong { font-size: 16px; font-weight: 500; }
.success-card p { font-size: 14px; margin-top: 0.4rem; opacity: 0.85; }
@media (max-width: 480px) {
  .page { padding: 1rem 0.75rem 3rem; }
  .logo { max-width: 200px; }
  input[type=text], input[type=email], input[type=number], textarea { font-size: 16px; }
  .submit-btn { font-size: 16px; padding: 0.85rem; }
}
</style>

    <h1>Community Meal</h1>
    <p class="subtitle">Saturday 28th June</p>
  </div>

  <div class="items-section">
    <div class="items-title">Items still needed</div>
    <div id="items-status"><p style="font-size:14px;color:var(--color-text-tertiary);font-style:italic;">Loading...</p></div>
  </div>

  <div class="form-card" id="form-section">
    <div class="field">
      <label class="field-label" for="inp-name">Full name *</label>
      <input type="text" id="inp-name" placeholder="Your name" />
    </div>
    <div class="field">
      <label class="field-label" for="inp-email">Email address *</label>
      <input type="email" id="inp-email" placeholder="your@email.com" />
    </div>
    <div class="field">
      <label class="field-label">Are you able to attend our Community Meal? *</label>
      <div class="radio-group">
        <label><input type="radio" name="attending" value="yes" onchange="handleAttend(this)"> Yes, I can attend</label>
        <label><input type="radio" name="attending" value="no" onchange="handleAttend(this)"> No, I am unable to attend</label>
      </div>
    </div>
    <div class="field hidden" id="headcount-field">
      <label class="field-label" for="inp-headcount">How many people are coming (including yourself)?</label>
      <input type="number" id="inp-headcount" min="1" max="30" placeholder="e.g. 2" style="max-width:100px;" />
    </div>
    <div id="allergy-section" class="hidden">
      <div class="field">
        <label class="field-label">Are there any allergies we need to be aware of?</label>
        <div class="radio-group">
          <label><input type="radio" name="allergy" value="no" onchange="handleAllergy(this)"> No allergies</label>
          <label><input type="radio" name="allergy" value="yes" onchange="handleAllergy(this)"> Yes, there are allergies</label>
        </div>
      </div>
      <div class="field hidden" id="allergy-detail-field">
        <label class="field-label" for="inp-allergy">Please describe the allergies</label>
        <textarea id="inp-allergy" rows="2" placeholder="e.g. nuts, gluten, dairy"></textarea>
      </div>
    </div>
    <div class="field hidden" id="items-field">
      <label class="field-label">Are you able to bring any items to contribute?</label>
      <div class="radio-group">
        <label><input type="radio" name="bringing" value="yes" onchange="handleBringing(this)"> Yes, I can bring items</label>
        <label><input type="radio" name="bringing" value="no" onchange="handleBringing(this)"> No, I am not able to bring items</label>
      </div>
    </div>
    <div class="field hidden" id="items-picker-field">
      <label class="field-label">Select the items you will bring</label>
      <div class="items-grid" id="items-grid"></div>
      <div class="info-note">Select as many items as you like. Items that have already been fully claimed are greyed out.</div>
    </div>
    <button class="submit-btn" onclick="submitForm()">Submit RSVP</button>
  </div>

  <div class="success-card" id="success-card">
    <strong>Thank you for your RSVP!</strong>
    <p id="success-detail"></p>
  </div>
</div>
<script>
var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzYkrbP3Qlek5N3Ik_6HeIT71DJxNNAZsdQz-VDYGirJi1EnB56McKo52mdufAYSqsgFA/exec";

var ITEMS = [
  { name: "Loaf of bread", needed: 8 },
  { name: "Tub of butter", needed: 2 },
  { name: "Tomato sauce", needed: 1 },
  { name: "BBQ sauce", needed: 1 },
  { name: "Mustard", needed: 1 },
  { name: "Jar of jalapenos", needed: 1 },
  { name: "Bag of grated cheese", needed: 3 },
  { name: "Container of coleslaw", needed: 2 }
];

var claimed = {};
ITEMS.forEach(function(item) { claimed[item.name] = 0; });

var quantities = {};
ITEMS.forEach(function(item) { quantities[item.name] = 0; });

function loadStatus() {
  try {
    fetch(SCRIPT_URL)
      .then(function(r) { return r.json(); })
      .then(function(data) {
        ITEMS.forEach(function(item) {
          claimed[item.name] = data[item.name] || 0;
        });
        renderStatus();
        renderPickers();
      })
      .catch(function(err) {
        console.warn('Could not load status:', err);
        renderStatus();
        renderPickers();
      });
  } catch(e) {
    console.warn('Fetch error:', e);
    renderStatus();
    renderPickers();
  }
}

function renderStatus() {
  var el = document.getElementById('items-status');
  var html = '';
  ITEMS.forEach(function(item) {
    var c = claimed[item.name] || 0;
    var n = item.needed;
    var remaining = Math.max(0, n - c);
    var pct = Math.min(100, Math.round((c / n) * 100));
    var done = remaining === 0;
    html += '<div class="item-row"><div class="item-info">';
    html += '<div class="item-name">' + item.name;
    if (n > 1) html += ' <span style="font-weight:400;color:var(--color-text-secondary);">x' + n + '</span>';
    html += '</div>';
    if (done) {
      html += '<div class="item-status done">All claimed - thank you!</div>';
    } else {
      html += '<div class="item-status needed">' + remaining + ' of ' + n + ' still needed</div>';
    }
    html += '<div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div>';
    html += '</div></div>';
  });
  el.innerHTML = html;
}

function getId(name) {
  return name.replace(/ /g, '-');
}

function renderPickers() {
  var grid = document.getElementById('items-grid');
  var html = '';
  for (var i = 0; i < ITEMS.length; i++) {
    var item = ITEMS[i];
    var c = claimed[item.name] || 0;
    var remaining = Math.max(0, item.needed - c);
    var fullyDone = remaining === 0;
    var qty = quantities[item.name] || 0;
    var id = getId(item.name);
    html += '<div class="item-picker' + (fullyDone ? ' fully-claimed' : '') + '" id="picker-' + id + '">';
    html += '<div><div class="item-picker-name">' + item.name + '</div>';
    html += '<div class="item-picker-remaining">' + (fullyDone ? 'Fully claimed' : remaining + ' still needed') + '</div></div>';
    html += '<div class="qty-control">';
    html += '<button class="qty-btn" onclick="changeQty(' + i + ', -1)"' + (qty === 0 ? ' disabled' : '') + '>-</button>';
    html += '<span class="qty-val" id="qty-' + id + '">' + qty + '</span>';
    html += '<button class="qty-btn" onclick="changeQty(' + i + ', 1)"' + ((fullyDone || qty >= remaining) ? ' disabled' : '') + '>+</button>';
    html += '</div></div>';
  }
  grid.innerHTML = html;
}

function changeQty(idx, delta) {
  var item = ITEMS[idx];
  var c = claimed[item.name] || 0;
  var remaining = Math.max(0, item.needed - c);
  var current = quantities[item.name] || 0;
  quantities[item.name] = Math.max(0, Math.min(remaining, current + delta));
  renderPickers();
}

function handleAttend(r) {
  var isYes = r.value === 'yes';
  document.getElementById('headcount-field').classList.toggle('hidden', !isYes);
  document.getElementById('allergy-section').classList.toggle('hidden', !isYes);
  document.getElementById('items-field').classList.toggle('hidden', !isYes);
  document.getElementById('items-picker-field').classList.add('hidden');
  if (!isYes) {
    document.getElementById('allergy-detail-field').classList.add('hidden');
    var radios = document.querySelectorAll('input[name=allergy], input[name=bringing]');
    for (var i = 0; i < radios.length; i++) { radios[i].checked = false; }
    ITEMS.forEach(function(item) { quantities[item.name] = 0; });
  }
}

function handleAllergy(r) {
  document.getElementById('allergy-detail-field').classList.toggle('hidden', r.value !== 'yes');
}

function handleBringing(r) {
  document.getElementById('items-picker-field').classList.toggle('hidden', r.value !== 'yes');
  if (r.value !== 'yes') {
    ITEMS.forEach(function(item) { quantities[item.name] = 0; });
    renderPickers();
  }
}

function submitForm() {
  var name = document.getElementById('inp-name').value.trim();
  var email = document.getElementById('inp-email').value.trim();
  var attendingEl = document.querySelector('input[name=attending]:checked');
  if (!name) { alert('Please enter your name.'); return; }
  if (!email || email.indexOf('@') === -1) { alert('Please enter a valid email address.'); return; }
  if (!attendingEl) { alert('Please indicate whether you can attend.'); return; }

  var allergyEl = document.querySelector('input[name=allergy]:checked');
  var itemsList = [];
  ITEMS.forEach(function(item) {
    if (quantities[item.name] > 0) {
      itemsList.push(quantities[item.name] + 'x ' + item.name);
    }
  });

  var entry = {
    timestamp: new Date().toISOString(),
    name: name,
    email: email,
    attending: attendingEl.value,
    headcount: attendingEl.value === 'yes' ? (document.getElementById('inp-headcount').value || '1') : '',
    allergy: allergyEl ? allergyEl.value : 'no',
    allergyDetail: document.getElementById('inp-allergy').value.trim(),
    items: itemsList.join(', ')
  };

  fetch(SCRIPT_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(entry)
  }).catch(function(err) { console.warn('Sheets sync failed:', err); });

  document.getElementById('form-section').style.display = 'none';
  var card = document.getElementById('success-card');
  card.style.display = 'block';
  var guests = parseInt(entry.headcount) || 1;
  var detail = '';
  if (entry.attending === 'yes') {
    detail = 'We look forward to seeing you' + (guests > 1 ? ' and ' + (guests - 1) + ' guest' + (guests > 2 ? 's' : '') : '') + ' on Saturday 28th June!';
    if (itemsList.length > 0) { detail += ' Thank you for bringing: ' + itemsList.join(', ') + '.'; }
  } else {
    detail = "Thanks for letting us know - we will miss you!";
  }
  document.getElementById('success-detail').textContent = detail;
}

loadStatus();
</script>
